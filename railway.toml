# Railway deploys this repository from its ROOT (the service's Root Directory must be blank or "/").
# The backend imports shared code from the extension's ./src folder (for example the match scoring
# in src/matching/scoreProfile.ts), so deploying only ./backend would leave those files missing.
#
# Railway first runs the root install on its own (it only needs to succeed; the backend needs none
# of the extension's packages), then these commands. Only the backend runs in production, never the
# Chrome extension build.

[build]
buildCommand = "npm --prefix backend ci"

[deploy]
startCommand = "npm --prefix backend start"
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
